    if(last && last.date){
      const dt=new Date(last.date+'T00:00:00');
      dt.setDate(dt.getDate()+1);
      nextDate=dt.toISOString().slice(0,10);
    } else {
      nextDate=Util.todayISO();
    }
    const label=new Date(nextDate+'T00:00:00').toLocaleDateString('en-US',{month:'short', day:'numeric'});
    const id=Store.addDailyReviewDay(label, nextDate, last? last.id : null);
    UIState.setDailyReviewDayId(id);
    showToast('New day added \u2713');
    App.navigate('dailyreview');
  }
  function deleteDailyReviewDay(dayId, label){
    const days=Store.getDailyReview();
    if(days.length<=1){ alert('At least one day must remain.'); return; }
    const ok=confirm('Delete the Day Start review for "'+label+'"? This cannot be undone.');
    if(!ok) return;
    Store.deleteDailyReviewDay(dayId);
    if(UIState.getDailyReviewDayId()===dayId) UIState.setDailyReviewDayId(null);
    showToast('Day deleted \u2713');
    App.navigate('dailyreview');
  }
  function updateDailyField(dayId, rowId, field, value){
    const days=Store.getDailyReview();
    const day=days.find(function(d){return d.id===dayId;});
    if(day){
      const row=day.rows.find(function(r){return r.id===rowId;});
      if(row){ row[field]=value; Store.setDailyReview(days); }
    }
    refresh();
  }
  function addDailyRow(dayId){
    const nameEl=document.getElementById('newDailyHubName_'+dayId);
    const typeEl=document.getElementById('newDailyHubType_'+dayId);
    const amEl=document.getElementById('newDailyHubAm_'+dayId);
    const name=nameEl.value.trim();
    if(!name){ alert('Enter a hub name.'); return; }
    const days=Store.getDailyReview();
    const day=days.find(function(d){return d.id===dayId;});
    const rec={id:Util.uid(), name:name, type:(typeEl.value.trim()||'DH'), am:amEl.value.trim()};
    DAILY_FIELDS.forEach(function(f){ rec[f.key]=''; });
    day.rows.push(rec);
    Store.setDailyReview(days);
    showToast('Hub row added \u2713');
    App.navigate('dailyreview');
  }
  function deleteDailyRow(dayId, rowId){
    const days=Store.getDailyReview();
    const day=days.find(function(d){return d.id===dayId;});
    day.rows=day.rows.filter(function(r){return r.id!==rowId;});
    Store.setDailyReview(days);
    showToast('Row removed \u2713');
    App.navigate('dailyreview');
  }
  function addChecklistItem(officeId, section){
    const prefix = section==='facility' ? 'Fac' : 'Ppl';
    const catEl=document.getElementById('new'+prefix+'Cat_'+officeId);
    const itemEl=document.getElementById('new'+prefix+'Item_'+officeId);
    const descEl=document.getElementById(section==='facility' ? ('newFacStd_'+officeId) : ('newPplCovers_'+officeId));
    const cat=catEl.value.trim(), item=itemEl.value.trim(), desc=descEl.value.trim();
    if(!cat||!item){ alert('Enter both category and item name.'); return; }
    const d=Store.getData(officeId);
    const row = section==='facility'
      ? {id:Util.uid(), cat:cat, item:item, std:desc, status:'Not Started', verified:'NA', remarks:'', responsible:''}
      : {id:Util.uid(), cat:cat, item:item, covers:desc, status:'Not Started', verified:'NA', remarks:'', responsible:''};
    d[section].push(row);
    Store.setData(officeId, d);
    refresh();
  }
  function deleteChecklistItem(officeId, section, id){
    const ok=confirm('Delete this checklist item? This cannot be undone.');
    if(!ok) return;
    const d=Store.getData(officeId);
    d[section]=d[section].filter(function(r){return r.id!==id;});
    Store.setData(officeId, d);
    refresh();
  }
  function addAssetItem(officeId){
    const nameEl=document.getElementById('newAssetName_'+officeId);
    const name=nameEl.value.trim();
    if(!name){ alert('Enter an asset name.'); return; }
    const d=Store.getData(officeId);
    d.assets.push({id:Util.uid(), name:name, req:0, avail:0, status:'Not Verified', auditDate:'', remarks:''});
    Store.setData(officeId, d);
    refresh();
  }
  function deleteAssetItem(officeId, id){
    const ok=confirm('Delete this asset item? This cannot be undone.');
    if(!ok) return;
    const d=Store.getData(officeId);
    d.assets=d.assets.filter(function(a){return a.id!==id;});
    Store.setData(officeId, d);
    refresh();
  }
  function addManpowerRole(officeId){
    const nameEl=document.getElementById('newRoleName_'+officeId);
    const typeEl=document.getElementById('newRoleType_'+officeId);
    const sancEl=document.getElementById('newRoleSanc_'+officeId);
    const roleName=nameEl.value.trim();
    if(!roleName){ alert('Enter a role/designation name.'); return; }
    const d=Store.getData(officeId);
    d.manpower.push({id:Util.uid(), role:roleName, type:typeEl.value, sanc:Number(sancEl.value||0), onroll:0, shift:'', remarks:''});
    Store.setData(officeId, d);
    refresh();
  }
  function deleteManpowerRole(officeId, id){
    const ok=confirm('Delete this manpower role? This removes its sanctioned count and on-roll data for this branch.');
    if(!ok) return;
    const d=Store.getData(officeId);
    d.manpower=d.manpower.filter(function(m){return m.id!==id;});
    Store.setData(officeId, d);
    refresh();
  }
  function exportBackup(){
    const bundle=Store.exportBackup();
    const blob=new Blob([JSON.stringify(bundle,null,2)], {type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.href=url;
    a.download='lastmile-dashboard-backup-'+stamp+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Backup downloaded \u2713');
  }
  function importBackup(inputEl){
    const file=inputEl.files && inputEl.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=function(e){
      try{
        const bundle=JSON.parse(e.target.result);
        const ok=confirm('Restoring this backup will REPLACE all current branches, logins, and data in this browser. Continue?');
        if(!ok){ inputEl.value=''; return; }
        Store.importBackup(bundle);
        showToast('Backup restored \u2713');
        App.refreshOfficeSelector();
        App.navigate('admin');
      } catch(err){
        alert('Could not restore this file: '+err.message);
      }
      inputEl.value='';
    };
    reader.readAsText(file);
  }
  function addOffice(){
    const name=document.getElementById('newOfficeName').value.trim();
    const code=document.getElementById('newOfficeCode').value.trim().toUpperCase();
    if(!name||!code){ alert('Enter both branch name and code.'); return; }
    Store.addOffice(name, code);
    App.refreshOfficeSelector();
    App.navigate('admin');
  }
  function deleteOffice(officeId, officeName){
    const offices=Store.getOffices();
    if(offices.length<=1){ alert('At least one branch must remain.'); return; }
    const ok=confirm('Delete branch "'+officeName+'"?\n\nThis permanently removes all its checklist, asset, manpower, org chart and operations data, and any office logins tied to it. This cannot be undone.');
    if(!ok) return;
    const remaining=offices.filter(function(o){return o.id!==officeId;});
    Store.setOffices(remaining);
    localStorage.removeItem('lmfd_data_'+officeId);
    const users=Store.getUsers().filter(function(u){return u.officeId!==officeId;});
    Store.setUsers(users);
    App.refreshOfficeSelector();
    App.navigate('admin');
  }
  function toggleOfficeStatus(officeId){
    Store.toggleOfficeStatus(officeId);
    App.refreshOfficeSelector();
    App.navigate('admin');
  }
  function saveUser(){
    const editingMobile=document.getElementById('editingUserMobile').value;
    const mobile=document.getElementById('newUserMobile').value.trim();
    const pass=document.getElementById('newUserPass').value;
    const name=document.getElementById('newUserName').value.trim();
    const role=document.getElementById('newUserRole').value;
    const officeId=document.getElementById('newUserOffice').value;
    if(!mobile||!pass||!name){ alert('Fill all fields.'); return; }
    const users=Store.getUsers();
    if(editingMobile){
      const u=users.find(function(x){return x.mobile===editingMobile;});
      if(!u){ alert('User not found.'); return; }
      if(mobile!==editingMobile && users.some(function(x){return x.mobile===mobile;})){ alert('Mobile number already exists.'); return; }
      u.mobile=mobile; u.password=pass; u.name=name; u.role=role; u.officeId=(role==='office'?officeId:null);
    } else {
      if(users.some(function(u){return u.mobile===mobile;})){ alert('Mobile number already exists.'); return; }
      users.push({mobile:mobile, password:pass, role:role, officeId:(role==='office'?officeId:null), name:name, active:true});
    }
    Store.setUsers(users);
    App.navigate('admin');
  }
  function editUserStart(mobile){
    const u=Store.getUsers().find(function(x){return x.mobile===mobile;});
    if(!u) return;
    document.getElementById('editingUserMobile').value=u.mobile;
    document.getElementById('newUserMobile').value=u.mobile;
    document.getElementById('newUserPass').value=u.password;
    document.getElementById('newUserName').value=u.name;
    document.getElementById('newUserRole').value=u.role;
    document.getElementById('officeFieldWrap').style.display=(u.role==='office'?'block':'none');
    if(u.officeId) document.getElementById('newUserOffice').value=u.officeId;
    document.getElementById('userFormTitle').textContent='Edit Login';
    document.getElementById('userSaveBtn').textContent='Update Login';
    document.getElementById('userCancelBtn').style.display='inline-block';
  }
  function cancelUserEdit(){
    App.navigate('admin');
  }
  function toggleUserActive(mobile){
    const users=Store.getUsers();
    const u=users.find(function(x){return x.mobile===mobile;});
    if(u){ u.active = (u.active===false)?true:false; Store.setUsers(users); }
    App.navigate('admin');
  }
  function deleteUser(mobile){
    const users=Store.getUsers();
    const target=users.find(function(x){return x.mobile===mobile;});
    if(!target) return;
    const superCount=users.filter(function(u){return u.role==='super';}).length;
    if(target.role==='super' && superCount<=1){ alert('At least one Super Admin login must remain.'); return; }
    const ok=confirm('Delete login for "'+target.name+'" ('+target.mobile+')? This cannot be undone.');
    if(!ok) return;
    Store.setUsers(users.filter(function(u){return u.mobile!==mobile;}));
    App.navigate('admin');
  }
  return {updateField:updateField, updateField2:updateField2, updateOpsSetting:updateOpsSetting, addEmployee:addEmployee,
    addOpsEntry:addOpsEntry, deleteOpsEntry:deleteOpsEntry, updateOpsEntryField:updateOpsEntryField, updateOpsEntryCustom:updateOpsEntryCustom,
    addOffice:addOffice, deleteOffice:deleteOffice, toggleOfficeStatus:toggleOfficeStatus,
    saveUser:saveUser, editUserStart:editUserStart, cancelUserEdit:cancelUserEdit, toggleUserActive:toggleUserActive, deleteUser:deleteUser,
    addManpowerRole:addManpowerRole, deleteManpowerRole:deleteManpowerRole, toggleFacilityFilter:toggleFacilityFilter,
    addCustomMetric:addCustomMetric, deleteCustomMetric:deleteCustomMetric,
    selectCostFacility:selectCostFacility, saveFacilityCostSettings:saveFacilityCostSettings, addCustomMetricAdmin:addCustomMetricAdmin,
    exportBackup:exportBackup, importBackup:importBackup,
    addChecklistItem:addChecklistItem, deleteChecklistItem:deleteChecklistItem, addAssetItem:addAssetItem, deleteAssetItem:deleteAssetItem,
    updateHubField:updateHubField, setHubSubTab:setHubSubTab, setHubAmFilter:setHubAmFilter, selectHubForChecklist:selectHubForChecklist,
    selectHubField:selectHubField, addHub:addHub, deleteHub:deleteHub, exportHubsCsv:exportHubsCsv,
    selectDailyReviewDay:selectDailyReviewDay, addDailyReviewDay:addDailyReviewDay, deleteDailyReviewDay:deleteDailyReviewDay,
    updateDailyField:updateDailyField, addDailyRow:addDailyRow, deleteDailyRow:deleteDailyRow,
    setDailyHubFilter:setDailyHubFilter, setDailyColFilter:setDailyColFilter, clearDailyFilters:clearDailyFilters,
    setOpsHubFilter:setOpsHubFilter, setAgentTrackAmFilter:setAgentTrackAmFilter, setAgentTrackGroupTab:setAgentTrackGroupTab,
    setAgentTrackSubTab:setAgentTrackSubTab, toggleAgentTrackKpis:toggleAgentTrackKpis, resetAgentTrackFilters:resetAgentTrackFilters,
    hardSyncAgentTrack:hardSyncAgentTrack, exportAgentTrackCsv:exportAgentTrackCsv, applyAgentTrackPaste:applyAgentTrackPaste,
    updateAgentTrackMeta:updateAgentTrackMeta, deleteAgentTrackRow:deleteAgentTrackRow,
    runPincodeFinder:runPincodeFinder, clearPincodeFinder:clearPincodeFinder, assignPincodeToHub:assignPincodeToHub, deleteSplitLogEntry:deleteSplitLogEntry};
})();

document.addEventListener('DOMContentLoaded', function(){
  Store.init();
  const officeUsers = Store.getUsers().filter(function(u){ return u.role==='office'; }).slice(0,3);
  const offMap = {};
  Store.getOffices().forEach(function(o){ offMap[o.id]=o.name; });
  const rowsHtml = officeUsers.map(function(u){
    return '<div class="credRow"><span>'+(offMap[u.officeId]||u.name)+' <span class="role">(office)</span></span><b>'+u.mobile+' / '+u.password+'</b></div>';
  }).join('');
  const credRowsEl=document.getElementById('credOfficeRows');
  if(credRowsEl) credRowsEl.innerHTML = rowsHtml;
  const existing = Auth.restore();
  if(existing){ App.start(existing); }
  document.getElementById('loginPass').addEventListener('keydown', function(e){ if(e.key==='Enter') Auth.login(); });
});
</script>
