<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Last-Mile Branch Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F3864; --navy-d:#152647; --teal:#0F7C6B; --teal-l:#EAF1EF;
    --amber:#B98900; --amber-bg:#FAEEDA; --red:#B3261E; --red-bg:#FCEAE9;
    --green:#1E7A3E; --green-bg:#E7F5EC; --grey:#717784; --grey-bg:#F1F0EE;
    --border:#E6E5E2; --bg:#F7F7F5; --purple:#5B3E96; --purple-bg:#EFE9F7;
    --ink:#0A0A0A; --accent:#B15F2C; --accent-from:#CF8047; --accent-to:#97501F;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{font-family:'Onest','Segoe UI',Inter,Arial,sans-serif;background:var(--bg);color:#1a1a1a;font-size:13px;letter-spacing:-.005em;}
  input,select,button,textarea{font-family:inherit;font-size:12.5px;}
  .mono{font-family:'JetBrains Mono',Consolas,monospace;}
  .lockText{color:var(--grey);font-style:italic;font-size:12.5px;}

  /* LOGIN */
  #loginScreen{height:100vh;width:100%;position:relative;overflow:hidden;background:var(--ink);}
  .landingStrip{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0;width:100%;height:100%;}
  .landingPanel{position:relative;height:100%;width:100%;overflow:hidden;min-width:0;}
  .landingPanel img{width:100%;height:100%;object-fit:cover;display:block;
    filter:grayscale(.25) contrast(1.05) brightness(1.02) sepia(.08) saturate(1.15);
    transition:transform .7s cubic-bezier(.22,1,.36,1);}
  .landingPanel:hover img{transform:scale(1.045);}
  .landingPanel::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(10,10,10,.30) 0%,rgba(10,10,10,.05) 30%,rgba(10,10,10,.05) 70%,rgba(10,10,10,.55) 100%);}
  .landingLogo{position:absolute;top:1.6rem;left:1.8rem;z-index:5;display:flex;align-items:center;gap:8px;color:#fff;
    text-shadow:0 2px 8px rgba(0,0,0,.5);}
  .landingLogo .mark{width:26px;height:26px;border-radius:9999px;background:linear-gradient(135deg,var(--accent-from),var(--accent-to));
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;flex-shrink:0;}
  .landingLogo b{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;}

  .loginTrigger{position:fixed;top:1.5rem;right:1.5rem;z-index:10;background:rgba(255,255,255,.14);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.28);
    color:#fff;padding:9px 22px;border-radius:9999px;font-size:12px;font-weight:600;text-transform:uppercase;
    letter-spacing:.07em;cursor:pointer;transition:background .18s,transform .18s;}
  .loginTrigger:hover{background:rgba(255,255,255,.26);transform:translateY(-1px);}

  .loginBackdrop{position:fixed;inset:0;background:rgba(10,10,10,0);pointer-events:none;z-index:8;transition:background .3s;}
  .loginBackdrop.open{background:rgba(10,10,10,.4);pointer-events:auto;}

  .loginBox{background:rgba(255,255,255,.96);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:30px 30px;width:370px;
    box-shadow:0 30px 80px rgba(0,0,0,.5);position:fixed;z-index:9;top:4.6rem;right:1.5rem;
    opacity:0;transform:translateY(-14px) scale(.97);pointer-events:none;
    transition:opacity .25s cubic-bezier(.22,1,.36,1),transform .25s cubic-bezier(.22,1,.36,1);}
  .loginBox.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  @media (max-width:900px){ .loginBox{width:88vw;right:6vw;top:4.2rem;} }
  .loginBrand{display:flex;align-items:center;gap:8px;margin-bottom:22px;}
  .loginBrand .mark{width:30px;height:30px;border-radius:9999px;background:linear-gradient(135deg,var(--accent-from),var(--accent-to));
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0;}
  .loginBrand b{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--ink);}
  .loginBox h1{font-size:20px;font-weight:600;color:var(--ink);margin:0 0 4px;letter-spacing:-.01em;}
  .loginBox p{font-size:12px;color:var(--grey);margin:0 0 24px;}
  .loginBox label{display:block;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--grey);margin:14px 0 6px;}
  .loginBox input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--grey-bg);
    transition:border-color .18s,background .18s;font-size:13px;}
  .loginBox input:focus{outline:none;border-color:var(--accent);background:#fff;}
  .loginBox button{width:100%;margin-top:22px;padding:11px;background:var(--ink);color:#fff;border:none;
    border-radius:9999px;font-weight:600;cursor:pointer;font-size:13.5px;text-transform:uppercase;letter-spacing:.05em;
    transition:background .18s cubic-bezier(.22,1,.36,1),transform .18s;}
  .loginBox button:hover{background:var(--accent-to);transform:translateY(-1px);}
  .loginBox button:active{transform:scale(.98);}
  .loginErr{color:var(--red);font-size:12px;margin-top:10px;min-height:14px;}
  .loginHint{margin-top:20px;font-size:11px;color:#999;border-top:1px solid var(--border);padding-top:14px;line-height:1.7;}
  .credCard{margin-top:18px;background:var(--grey-bg);border:1px solid var(--border);border-radius:14px;padding:12px 14px;}
  .credCard .credTitle{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:8px;}
  .credRow{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;padding:4px 0;color:#333;}
  .credRow b{font-family:'JetBrains Mono',Consolas,monospace;font-weight:600;color:var(--ink);}
  .credRow span.role{color:var(--grey);font-size:10.5px;}

  /* APP SHELL — fixed viewport, only .content scrolls */
  #app{display:none;height:100vh;}
  .shell{display:flex;height:100vh;overflow:hidden;}
  .sidebar{width:204px;background:var(--ink);color:#fff;flex-shrink:0;display:flex;flex-direction:column;height:100vh;
    position:relative;overflow:hidden;}
  .sidebar::after{content:'';position:absolute;left:-30%;bottom:-10%;width:160%;height:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(177,95,44,.16),transparent 70%);}
  .sidebar .brand{padding:16px;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0;position:relative;z-index:1;
    display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .sidebar .brand b{font-size:13.5px;font-weight:600;letter-spacing:.01em;}
  .sidebar .brand span{display:block;font-size:10px;color:var(--accent-from);margin-top:2px;text-transform:uppercase;letter-spacing:.08em;font-weight:500;}
  .sidebarToggleBtn{background:rgba(255,255,255,.08);border:none;color:#fff;width:24px;height:24px;border-radius:7px;cursor:pointer;
    font-size:14px;line-height:1;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .15s;}
  .sidebarToggleBtn:hover{background:rgba(255,255,255,.2);}
  .sidebar.collapsed{width:52px;}
  .sidebar.collapsed .brand{justify-content:center;padding:14px 6px;}
  .sidebar.collapsed .brand>div{display:none;}
  .sidebar.collapsed .navitem{justify-content:center;padding:10px 0;}
  .sidebar.collapsed .navitem span.lbl,.sidebar.collapsed .foot{display:none;}
  .sidebar.collapsed .navIcon{width:auto;}
  .navlist{flex:1;padding:8px 0;overflow-y:auto;position:relative;z-index:1;}
  .navitem{padding:10px 16px;font-size:12.5px;cursor:pointer;color:rgba(255,255,255,.6);border-left:3px solid transparent;
    display:flex;align-items:center;gap:9px;transition:background .18s cubic-bezier(.22,1,.36,1),color .18s;}
  .navIcon{font-size:14px;width:18px;text-align:center;flex-shrink:0;}
  .navitem:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.9);}
  .navitem.active{background:rgba(255,255,255,.07);color:#fff;border-left-color:var(--accent-from);font-weight:600;}
  .sidebar .foot{padding:10px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:10px;color:rgba(255,255,255,.35);
    flex-shrink:0;position:relative;z-index:1;}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden;}
  .topbar{background:#fff;border-bottom:1px solid var(--border);padding:9px 18px;display:flex;
    align-items:center;justify-content:space-between;flex-shrink:0;}
  .topbar .officeSel select{padding:5px 8px;border:1px solid var(--border);border-radius:12px;font-weight:600;color:var(--navy);font-size:12.5px;}
  .topbar .userInfo{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--grey);}
  #impersonateBanner{display:inline-flex;align-items:center;gap:6px;}
  .topbar .userInfo b{color:#222;}
  .topbar .verTag{font-size:9.5px;color:var(--grey);opacity:.6;}
  .roleTag{padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;}
  .roleTag.super{background:var(--purple-bg);color:var(--purple);}
  .roleTag.office{background:var(--teal-l);color:var(--teal);}
  .logoutBtn{padding:6px 13px;background:var(--grey-bg);border:1px solid var(--border);border-radius:9999px;cursor:pointer;font-size:11.5px;
    transition:background .18s,transform .18s;}
  .logoutBtn:hover{background:var(--border);transform:translateY(-1px);}
  .logoutBtn:hover{background:#e8e8e8;}

  .content{padding:16px 18px;flex:1;overflow-y:auto;overflow-x:auto;}
  .pageTitle{font-size:16.5px;font-weight:700;color:var(--navy);margin:0 0 2px;}
  .pageSub{font-size:11.5px;color:var(--grey);margin:0 0 12px;}

  /* CARDS */
  .cardGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;margin-bottom:12px;}
  .kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 11px 8px;transition:box-shadow .18s,transform .18s;
    position:relative;overflow:hidden;}
  .kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--navy),var(--teal));
    opacity:.55;}
  .kpi.good::before{background:linear-gradient(90deg,var(--teal),var(--green));}
  .kpi.warn::before{background:linear-gradient(90deg,var(--amber),#e0ac2e);}
  .kpi.bad::before{background:linear-gradient(90deg,var(--red),#d9534f);}
  .kpi:hover{box-shadow:0 6px 20px rgba(31,56,100,.12);transform:translateY(-2px);}
  .kpi .lbl{font-size:9px;color:var(--grey);text-transform:uppercase;letter-spacing:.03em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi .val{font-size:16.5px;font-weight:800;color:var(--navy);margin-top:2px;letter-spacing:-.01em;}
  .kpi .sub{font-size:9.5px;color:var(--grey);margin-top:1px;line-height:1.3;}
  .kpi.warn .val{color:var(--amber);}
  .kpi.bad .val{color:var(--red);}
  .kpi.good .val{color:var(--green);}

  /* REPORTS / INSIGHT CARDS */
  .reportHero{background:linear-gradient(120deg,var(--navy) 0%,#132c54 55%,var(--teal) 130%);color:#fff;border-radius:12px;
    padding:22px 24px;margin-bottom:16px;position:relative;overflow:hidden;}
  .reportHero::after{content:'';position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%);}
  .reportHero h1{font-size:19px;font-weight:800;margin:0 0 4px;position:relative;}
  .reportHero p{font-size:12px;color:rgba(255,255,255,.8);margin:0;max-width:640px;position:relative;}
  .reportHero .tagRow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;position:relative;}
  .reportHero .tag{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:20px;
    padding:3px 10px;font-size:10.5px;font-weight:600;}
  .insightGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px;}
  .insightCard{background:#fff;border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:12px;
    padding:13px 15px;transition:box-shadow .18s,transform .18s;}
  .insightCard:hover{box-shadow:0 6px 18px rgba(31,56,100,.1);transform:translateY(-2px);}
  .insightCard .icon{font-size:18px;margin-bottom:6px;display:block;}
  .insightCard h4{margin:0 0 5px;font-size:12.5px;color:var(--navy);font-weight:700;}
  .insightCard p{margin:0;font-size:11.5px;color:#444;line-height:1.5;}
  .insightCard.navy{border-left-color:var(--navy);}
  .insightCard.amber{border-left-color:var(--amber);}
  .insightCard.purple{border-left-color:var(--purple);}
  .sectionHead{display:flex;align-items:center;gap:8px;margin:20px 0 10px;}
  .sectionHead .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);flex-shrink:0;}
  .sectionHead h3{margin:0;font-size:13.5px;color:var(--navy);font-weight:700;}
  .statStrip{display:flex;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px;
    background:#fff;flex-wrap:wrap;}
  .statStrip .cell{flex:1;min-width:104px;padding:8px 10px;border-right:1px solid var(--border);}
  .statStrip .cell:last-child{border-right:none;}
  .statStrip .cell .n{font-size:15px;font-weight:800;color:var(--navy);}
  .statStrip .cell .l{font-size:9px;color:var(--grey);text-transform:uppercase;letter-spacing:.03em;margin-top:1px;}

  /* Ultra-compact single-line badge, for dense ops-style rows (Live Agent Tracking) */
  .badgeRow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .badgeRow .badge{flex:1 1 96px;min-width:92px;border-radius:8px;padding:6px 9px;color:#fff;}
  .badgeRow .badge .lbl{font-size:8.5px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .badgeRow .badge .val{font-size:14.5px;font-weight:800;margin-top:1px;}
  .badgeRow .badge .val small{font-size:10px;font-weight:600;opacity:.85;margin-left:2px;}
  .badge.c-purple{background:linear-gradient(135deg,#6b46c1,#4c2f91);}
  .badge.c-green{background:linear-gradient(135deg,#1e9e5a,#16793f);}
  .badge.c-blue{background:linear-gradient(135deg,#1f78d1,#155ba3);}
  .badge.c-grey{background:linear-gradient(135deg,#5b6270,#454b57);}
  .badge.c-red{background:linear-gradient(135deg,#d6453f,#b3312c);}

  /* TABLE */
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:7px;overflow:hidden;}
  thead th{background:var(--navy);color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.02em;
    padding:6px 7px;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:1;}
  tbody td{padding:4px 7px;border-top:1px solid var(--border);font-size:11.5px;vertical-align:top;}
  tbody tr:nth-child(even){background:#FAFBFC;}
  tr.catRow td{background:var(--teal-l);color:var(--teal);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.02em;padding:4px 7px;}
  tr.totalRow td{background:var(--grey-bg);font-weight:700;}
  td input[type=text],td input[type=number],td input[type=date],td select{width:100%;padding:3px 5px;border:1px solid var(--border);
    border-radius:4px;background:#fffdf5;min-width:64px;font-size:11.5px;}
  td input[readonly]{background:#F2F2F2;color:#555;}
  .tblWrap{overflow-x:auto;border-radius:7px;margin-bottom:12px;max-height:340px;overflow-y:auto;}
  .tblWrap.tall{max-height:460px;}

  .pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:600;}
  .pill.Completed,.pill.OK,.pill.Yes{background:var(--green-bg);color:var(--green);}
  .pill.InProgress,.pill.Partial,.pill.Shortage{background:var(--amber-bg);color:var(--amber);}
  .pill.NotStarted,.pill.No,.pill.Damaged{background:var(--red-bg);color:var(--red);}
  .pill.NA,.pill.NotVerified,.pill.Excess{background:var(--grey-bg);color:var(--grey);}

  .sectionBtns{display:flex;gap:8px;margin-bottom:10px;}
  .btn{padding:7px 15px;border-radius:9999px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:11.5px;font-weight:600;
    transition:background .18s cubic-bezier(.22,1,.36,1),transform .18s cubic-bezier(.22,1,.36,1),box-shadow .18s;}
  .btn:hover{background:var(--grey-bg);transform:translateY(-1px);}
  .btn:active{transform:scale(.96);}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn.primary:hover{background:var(--accent-to);border-color:var(--accent-to);box-shadow:0 4px 12px rgba(177,95,44,.28);}
  .btn.danger{color:var(--red);border-color:var(--red-bg);}
  .btn.danger:hover{background:var(--red-bg);}
  .btn.small{padding:4px 10px;font-size:10.5px;}

  /* ORG CHART */
  .orgTree{display:flex;flex-direction:column;align-items:center;gap:7px;margin:6px 0 14px;padding:12px;
    background:#fff;border:1px solid var(--border);border-radius:12px;overflow-x:auto;}
  .orgLevel{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .orgNode{background:var(--navy);color:#fff;border-radius:7px;padding:6px 10px;min-width:128px;text-align:center;}
  .orgNode.l2{background:var(--teal);}
  .orgNode.l3{background:var(--teal-l);color:var(--navy);}
  .orgNode .t{font-weight:700;font-size:11px;}
  .orgNode .n{font-size:10.5px;margin-top:2px;opacity:.9;}
  .orgNode .c{font-size:9.5px;margin-top:1px;opacity:.75;}
  .connector{width:2px;background:var(--border);height:10px;}

  .adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;
    transition:box-shadow .18s,transform .18s;}
  .panel h3{margin:0 0 8px;font-size:12.5px;color:var(--navy);}
  .panel input,.panel select{width:100%;padding:6px;margin-bottom:6px;border:1px solid var(--border);border-radius:6px;font-size:12px;}
  .miniList{font-size:11.5px;max-height:150px;overflow-y:auto;}
  .miniList div{padding:4px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;}

  .inlineForm{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:8px;align-items:end;}
  .inlineForm label{font-size:10px;font-weight:600;color:var(--grey);display:block;margin-bottom:2px;}
  .inlineForm input,.inlineForm select{width:100%;padding:5px 6px;border:1px solid var(--border);border-radius:5px;font-size:11.5px;}

  .lockBanner{background:var(--amber-bg);color:var(--amber);padding:7px 11px;border-radius:6px;font-size:11px;margin-bottom:10px;}
  .placeholderBox{background:#fff;border:1px dashed var(--border);border-radius:10px;padding:26px;text-align:center;color:var(--grey);font-size:12px;}

  .toast{position:fixed;bottom:18px;right:18px;background:var(--green);color:#fff;padding:8px 16px;border-radius:6px;
    font-size:12px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.22);opacity:0;transform:translateY(6px);
    transition:opacity .2s,transform .2s;pointer-events:none;z-index:999;}
  .toast.show{opacity:1;transform:translateY(0);}

  /* Collapsible per-branch sections (All Branches view) */
  .branchSection{background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  .branchSection summary{padding:9px 14px;font-weight:700;color:var(--navy);cursor:pointer;font-size:12.5px;
    background:var(--teal-l);list-style:none;display:flex;justify-content:space-between;align-items:center;}
  .branchSection summary::-webkit-details-marker{display:none;}
  .branchSection summary .stat{font-size:10.5px;color:var(--teal);font-weight:600;}
  .branchSection .branchBody{padding:12px 14px;}

  /* HUB VISIT TRACKER */
  .subTabBar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:0;}
  .subTabBtn{padding:8px 14px;border:none;background:none;cursor:pointer;font-size:12px;font-weight:600;color:var(--grey);
    border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;}
  .subTabBtn:hover{color:var(--navy);}
  .subTabBtn.active{color:var(--navy);border-bottom-color:var(--accent-from);}
  .miniBar{width:100%;height:6px;border-radius:4px;background:var(--grey-bg);overflow:hidden;margin-top:4px;}
  .miniBar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--navy));border-radius:4px;}
  .miniBar.low i{background:linear-gradient(90deg,var(--red),#d9534f);}
  .miniBar.mid i{background:linear-gradient(90deg,var(--amber),#e0ac2e);}

const LandingUI = (function(){
  function toggleLogin(){
    const box=document.getElementById('loginBox');
    const backdrop=document.getElementById('loginBackdrop');
    const opening = !box.classList.contains('open');
    box.classList.toggle('open');
    backdrop.classList.toggle('open');
    if(opening) setTimeout(function(){ document.getElementById('loginMobile').focus(); }, 180);
  }
  function closeLogin(){
    document.getElementById('loginBox').classList.remove('open');
    document.getElementById('loginBackdrop').classList.remove('open');
  }
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape') closeLogin();
  });
  return {toggleLogin:toggleLogin, closeLogin:closeLogin};
})();

const Util = (function(){
  function uid(){return 'id'+Math.random().toString(36).slice(2,10);}

  function pillClass(v){ return (v||'NA').replace(/\s|\//g,''); }
  function inr(n){ n=Number(n||0); return '\u20B9'+n.toLocaleString('en-IN'); }
  return {uid, todayISO, pillClass, inr};
})();

function seedHubs(){
  return SEED_HUBS.map(function(h){
    const rec=Object.assign({id:Util.uid(), lat:'', lng:''}, h);
    HUB_FIELDS.forEach(function(f){ if(!(f.key in rec)) rec[f.key]=''; });
    return rec;
  });
}
function hubFieldValue(h, f){ return h[f.key]!==undefined && h[f.key]!==null ? h[f.key] : ''; }
function hubFieldFilled(h, f){ const v=hubFieldValue(h,f); return v!==''&&v!==null&&v!==undefined; }
function hubCompletion(h){
  const filled = HUB_FIELDS.filter(function(f){ return hubFieldFilled(h,f); }).length;
  return {filled:filled, total:HUB_FIELDS.length, pct: Math.round(filled/HUB_FIELDS.length*100)};
}
function hubHasGeo(h){ return h.lat!==''&&h.lat!=null&&!isNaN(h.lat)&&h.lng!==''&&h.lng!=null&&!isNaN(h.lng); }
function haversineKm(lat1, lon1, lat2, lon2){
  const toRad=function(d){ return d*Math.PI/180; };
  const R=6371;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function pincodeTokens(pincodeStr){ return (pincodeStr||'').split(/[,;\s]+/).map(function(p){return p.trim();}).filter(Boolean); }
function findHubServingPincode(pincode){
  const target=String(pincode||'').trim();
  if(!target) return null;
  return Store.getHubs().find(function(h){ return pincodeTokens(h.pincode).indexOf(target)!==-1; }) || null;
}
function pincodeNearestHubs(lat, lng, limit){
  const hubs=Store.getHubs().filter(hubHasGeo);
  const scored=hubs.map(function(h){ return {hub:h, distKm:haversineKm(lat,lng,Number(h.lat),Number(h.lng))}; });
  scored.sort(function(a,b){ return a.distKm-b.distKm; });
  return scored.slice(0, limit||5);
}

    }

        changed=true;
      }
      if(changed) setData(o.id, d);
    });
   } catch(e) {
     StorageAlert.trigger(e);
   }
  }
  function safeGet(key, fallback){
    try { const v=localStorage.getItem(key); return v===null? fallback : v; }
    catch(e){ StorageAlert.trigger(e); return fallback; }
  }
  function safeSet(key, value){
    try { localStorage.setItem(key, value); return true; }
    catch(e){ StorageAlert.trigger(e); return false; }
  }
  const getOffices=function(){ return JSON.parse(safeGet(OFFICES_KEY,'[]')); };
  const setOffices=function(v){ safeSet(OFFICES_KEY, JSON.stringify(v)); };
  const getUsers=function(){ return JSON.parse(safeGet(USERS_KEY,'[]')); };
  const setUsers=function(v){ safeSet(USERS_KEY, JSON.stringify(v)); };
  const getData=function(officeId){ return JSON.parse(safeGet(DATA_PREFIX+officeId,'null'))||seedOfficeData(); };
  const setData=function(officeId,data){ safeSet(DATA_PREFIX+officeId, JSON.stringify(data)); };
  const getHubs=function(){ return JSON.parse(safeGet(HUBS_KEY,'null'))||seedHubs(); };
  const setHubs=function(v){ safeSet(HUBS_KEY, JSON.stringify(v)); };
  const getAgentTrack=function(){ return JSON.parse(safeGet(AGENTTRACK_KEY,'null'))||seedAgentTrack(); };
  const setAgentTrack=function(v){ safeSet(AGENTTRACK_KEY, JSON.stringify(v)); };
  const getSplitLog=function(){ return JSON.parse(safeGet(SPLITLOG_KEY,'null'))||[]; };

  const deleteHub=function(hubId){
    setHubs(getHubs().filter(function(h){ return h.id!==hubId; }));
  };
  const getDailyReview=function(){ return JSON.parse(safeGet(DAILY_KEY,'null'))||seedDailyReview(); };
  const setDailyReview=function(v){ safeSet(DAILY_KEY, JSON.stringify(v)); };
  const addDailyReviewDay=function(label, dateStr, cloneFromDayId){
    const days=getDailyReview();
    const template = cloneFromDayId ? days.find(function(d){return d.id===cloneFromDayId;}) : days[days.length-1];
    const rows = (template? template.rows : []).map(function(r){
      const rec={id:Util.uid(), name:r.name, type:r.type, am:r.am};
      DAILY_FIELDS.forEach(function(f){ rec[f.key]=''; });
      return rec;
    });
    const rec={id:Util.uid(), label:label, date:dateStr, rows:rows};
    days.push(rec);
    setDailyReview(days);
    return rec.id;
  };
  const deleteDailyReviewDay=function(dayId){
    setDailyReview(getDailyReview().filter(function(d){return d.id!==dayId;}));
  };
  const addOffice=function(name,code){
    const offices=getOffices();
    const id='off_'+name.toLowerCase().replace(/[^a-z0-9]+/g,'_')+'_'+Util.uid();
    offices.push({id:id,name:name,code:code,status:'Active'});
    setOffices(offices);
    setData(id, seedOfficeData());
    return id;
  };
  const toggleOfficeStatus=function(officeId){
    const offices=getOffices();
    const o=offices.find(function(x){return x.id===officeId;});
    if(o){ o.status = (o.status==='Active')?'Closed':'Active'; setOffices(offices); }
  };
  const exportBackup=function(){
    const offices=getOffices();
    const bundle={ exportedAt:new Date().toISOString(), offices:offices, users:getUsers(), data:{}, hubs:getHubs(), dailyReview:getDailyReview(), agentTrack:getAgentTrack(), splitLog:getSplitLog() };
    offices.forEach(function(o){ bundle.data[o.id]=getData(o.id); });
    return bundle;
  };
  const importBackup=function(bundle){
    if(!bundle || !Array.isArray(bundle.offices) || !Array.isArray(bundle.users) || !bundle.data){
      throw new Error('This file does not look like a valid dashboard backup.');
    }
    setOffices(bundle.offices);
    setUsers(bundle.users);
    Object.keys(bundle.data).forEach(function(officeId){ setData(officeId, bundle.data[officeId]); });
    if(Array.isArray(bundle.hubs)) setHubs(bundle.hubs);
    if(Array.isArray(bundle.dailyReview)) setDailyReview(bundle.dailyReview);
    if(bundle.agentTrack) setAgentTrack(bundle.agentTrack);
    if(Array.isArray(bundle.splitLog)) setSplitLog(bundle.splitLog);
  };
  return {init:init, getOffices:getOffices, setOffices:setOffices, getUsers:getUsers, setUsers:setUsers, getData:getData, setData:setData,
    addOffice:addOffice, toggleOfficeStatus:toggleOfficeStatus, exportBackup:exportBackup, importBackup:importBackup,

    getAgentTrack:getAgentTrack, setAgentTrack:setAgentTrack, getSplitLog:getSplitLog, setSplitLog:setSplitLog};
})();

const Auth = (function(){
  let session=null;
  function login(){
    const mobile=document.getElementById('loginMobile').value.trim();
    const pass=document.getElementById('loginPass').value;
    const user=Store.getUsers().find(function(u){ return u.mobile===mobile && u.password===pass; });
    const err=document.getElementById('loginErr');
    if(!user){ err.textContent='Invalid mobile number or password.'; return; }
    if(user.active===false){ err.textContent='This login has been disabled. Contact your administrator.'; return; }
    if(user.role==='office'){
      const office=Store.getOffices().find(function(o){ return o.id===user.officeId; });
      if(office && office.status==='Closed'){ err.textContent='This branch is closed. Contact your administrator.'; return; }
    }
    err.textContent='';
    session={mobile:user.mobile, role:user.role, officeId:user.officeId||null, name:user.name};
    sessionStorage.setItem('lmfd_session', JSON.stringify(session));
    App.start(session);
  }
  function logout(){
    session=null;
    sessionStorage.removeItem('lmfd_session');
    sessionStorage.removeItem('lmfd_impersonator_backup');
    document.getElementById('app').style.display='none';
    document.getElementById('loginScreen').style.display='block';
    document.getElementById('loginMobile').value='';
    document.getElementById('loginPass').value='';
    LandingUI.closeLogin();
  }
  function restore(){
    const raw=sessionStorage.getItem('lmfd_session');
    if(raw){ session=JSON.parse(raw); return session; }
    return null;
  }
  function impersonate(mobile){
    if(!session || session.role!=='super'){ alert('Only Super Admin can switch accounts.'); return; }
    const target=Store.getUsers().find(function(u){ return u.mobile===mobile; });
    if(!target){ alert('Login not found.'); return; }
    if(target.active===false){ alert('That login is disabled. Enable it first.'); return; }
    sessionStorage.setItem('lmfd_impersonator_backup', JSON.stringify(session));
    session={mobile:target.mobile, role:target.role, officeId:target.officeId||null, name:target.name, impersonating:true};
    sessionStorage.setItem('lmfd_session', JSON.stringify(session));
    App.start(session);
  }
  function returnToSuper(){
    const raw=sessionStorage.getItem('lmfd_impersonator_backup');
    if(!raw) return;
    session=JSON.parse(raw);
    sessionStorage.setItem('lmfd_session', JSON.stringify(session));
    sessionStorage.removeItem('lmfd_impersonator_backup');
    App.start(session);
  }
  function isImpersonating(){
    return !!sessionStorage.getItem('lmfd_impersonator_backup');
  }
  return {login:login, logout:logout, restore:restore, get:function(){ return session; },
    impersonate:impersonate, returnToSuper:returnToSuper, isImpersonating:isImpersonating};
})();

const App=(function(){
  let currentOffice=null;
  let currentRoute='dashboard';
  let MODULES=[];

  function baseModules(session){
    const mods=[
      {key:'dashboard', label:'Dashboard Overview', icon:'\u{1F4CA}'},
      {key:'agenttrack', label:'Live Agent Tracking', icon:'\u{1F4E1}'},
      {key:'hubs', label:'Hub Visit Tracker', icon:'\u{1F4CD}'},
      {key:'pincodefinder', label:'Pincode Split Finder', icon:'\u{1F5FA}\uFE0F'},
      {key:'dailyreview', label:'Daily Review (Day Start)', icon:'\u2600\uFE0F'},
      {key:'ops', label:'Operations Dashboard', icon:'\u{1F69A}'},
      {key:'orgchart', label:'Org Chart', icon:'\u{1F465}'},
      {key:'facility', label:'Facility Checklist (IPP)', icon:'\u{1F3E2}'},
      {key:'assets', label:'Asset Audit', icon:'\u{1F4E6}'},
      {key:'manpower', label:'Sanctioned Manpower', icon:'\u{1F4CB}'},
      {key:'peopleorg', label:'People & Organization', icon:'\u{1F4C4}'},
    ];
    if(session.role==='super') mods.push({key:'admin', label:'Admin / Branch Setup', icon:'\u2699\uFE0F'});
    return mods;
  }

  function start(session){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('userLabel').textContent = session.name;
    const roleTag=document.getElementById('roleTagEl');
    roleTag.textContent = session.role==='super'?'Super Admin':'Office / Manager';
    roleTag.className = 'roleTag '+session.role;
    const impBanner=document.getElementById('impersonateBanner');
    if(Auth.isImpersonating()){
      impBanner.style.display='inline-flex';
      impBanner.innerHTML='<span class="pill Shortage" style="margin-right:8px;">Viewing as this account</span>'
        + '<button class="btn small" onclick="Auth.returnToSuper()">\u2190 Return to Super Admin</button>';
    } else {
      impBanner.style.display='none';
      impBanner.innerHTML='';
    }

    const offices=Store.getOffices();
    currentOffice = session.role==='super' ? (offices[0]? offices[0].id:null) : session.officeId;
    MODULES = baseModules(session);
    renderOfficeSelector(session, offices);
    renderNav();
    try { if(localStorage.getItem('lmfd_sidebar_collapsed')==='1') document.querySelector('.sidebar').classList.add('collapsed'); } catch(e){}
    navigate('dashboard');
  }

  function toggleSidebar(){
    const sb=document.querySelector('.sidebar');
    const collapsed=sb.classList.toggle('collapsed');
    try { localStorage.setItem('lmfd_sidebar_collapsed', collapsed?'1':'0'); } catch(e){}
  }

  function renderOfficeSelector(session, offices){
    const wrap=document.getElementById('officeSelWrap');
    if(session.role==='super'){
      // Global branch switcher removed from the topbar \u2014 branch context is now chosen inline
      // on the Dashboard Overview page (see Views.dashboard) and via the Hub filter on Operations Dashboard.
      wrap.innerHTML = '';
    } else {
      const o=offices.find(function(x){ return x.id===currentOffice; });
      wrap.innerHTML = '<div style="font-weight:700;color:var(--navy);">'+(o?o.name:'')+' Branch'+(o&&o.status==='Closed'?' <span class="pill No" style="margin-left:6px;">Closed</span>':'')+'</div>';
    }
    document.getElementById('brandOffice').textContent = currentOffice==='ALL' ? 'All Branches' : ((offices.find(function(o){return o.id===currentOffice;})||{}).name || '');
  }

  function switchOffice(id){
    currentOffice=id;
    const offices=Store.getOffices();
    document.getElementById('brandOffice').textContent = id==='ALL' ? 'All Branches' : ((offices.find(function(o){return o.id===id;})||{}).name||'');
    navigate(currentRoute);
  }

  function renderNav(){
    const nav=document.getElementById('navList');
    nav.innerHTML = MODULES.map(function(m){ return '<div class="navitem" id="nav_'+m.key+'" onclick="App.navigate(\''+m.key+'\')"><span class="navIcon">'+m.icon+'</span><span class="lbl">'+m.label+'</span></div>'; }).join('');
    const active=document.getElementById('nav_'+currentRoute);
    if(active) active.classList.add('active');
  }

  function navigate(route){
    currentRoute=route;
    document.querySelectorAll('.navitem').forEach(function(n){ n.classList.remove('active'); });
    const active=document.getElementById('nav_'+route);
    if(active) active.classList.add('active');
    const c=document.getElementById('content');
    const role=Auth.get().role;
    if(route==='dashboard') c.innerHTML = Views.dashboard(currentOffice, role);
    else if(route==='agenttrack') c.innerHTML = Views.agentTrack(role);
    else if(route==='hubs') c.innerHTML = Views.hubs(role);
    else if(route==='pincodefinder') c.innerHTML = Views.pincodeFinder(role);
    else if(route==='dailyreview') c.innerHTML = Views.dailyReview(role);
    else if(route==='ops') c.innerHTML = Views.operations(currentOffice, role);
    else if(route==='orgchart') c.innerHTML = Views.orgChart(currentOffice, role);
    else if(route==='facility') c.innerHTML = Views.facility(currentOffice, role);
    else if(route==='assets') c.innerHTML = Views.assets(currentOffice, role);
    else if(route==='manpower') c.innerHTML = Views.manpower(currentOffice, role);
    else if(route==='peopleorg') c.innerHTML = Views.peopleOrg(currentOffice, role);
    else if(route==='admin') c.innerHTML = Views.admin();
  }

  function getOffice(){ return currentOffice; }

  function refreshOfficeSelector(){
    const session=Auth.get();
    const offices=Store.getOffices();
    if(session.role==='super' && currentOffice!=='ALL' && !offices.find(function(o){return o.id===currentOffice;})){
      currentOffice = offices[0] ? offices[0].id : 'ALL';
    }
    renderOfficeSelector(session, offices);
  }

  return {start:start, navigate:navigate, switchOffice:switchOffice, getOffice:getOffice, refreshOfficeSelector:refreshOfficeSelector, toggleSidebar:toggleSidebar};
})();

/* ============================================================
   AGGREGATION HELPERS (for 'ALL' branches view)
============================================================ */
function opsEntryCost(e, settings){
  settings = settings || {ratePerKm:0, ratePerDelivery:0, fixedCostPerWorkingDay:0};
  return Number(e.kmsRun||0)*Number(settings.ratePerKm||0) +
         Number(e.delivered||0)*Number(settings.ratePerDelivery||0) +
         Number(settings.fixedCostPerWorkingDay||0);
}
function aggregateOpsAcrossOffices(hubFilter){
  const offices=Store.getOffices();
  const rows=[];
  offices.forEach(function(o){
    const d=Store.getData(o.id);
    const entries = hubFilter ? d.opsEntries.filter(function(e){return e.hub===hubFilter;}) : d.opsEntries;
    const totInward=entries.reduce(function(s,e){ return s+Number(e.inward||0); },0);
    const totDelivered=entries.reduce(function(s,e){ return s+Number(e.delivered||0); },0);
    const totCOD=entries.reduce(function(s,e){ return s+Number(e.codCash||0); },0);
    const totKms=entries.reduce(function(s,e){ return s+Number(e.kmsRun||0); },0);
    const totCost=entries.reduce(function(s,e){ return s+opsEntryCost(e,d.opsSettings); },0);
    rows.push({id:o.id, name:o.name, status:o.status, totInward:totInward, totDelivered:totDelivered, totCOD:totCOD, totKms:totKms, totCost:totCost});
  });
  return rows;
}
function aggregateOpsByHub(){
  const offices=Store.getOffices();
  const byHub={};
  offices.forEach(function(o){
    const d=Store.getData(o.id);
    d.opsEntries.forEach(function(e){
      const key=e.hub||'Unassigned';
      if(!byHub[key]) byHub[key]={hub:key, totInward:0, totDelivered:0, totCOD:0, totKms:0, totCost:0};
      byHub[key].totInward+=Number(e.inward||0);
      byHub[key].totDelivered+=Number(e.delivered||0);
      byHub[key].totCOD+=Number(e.codCash||0);
      byHub[key].totKms+=Number(e.kmsRun||0);
      byHub[key].totCost+=opsEntryCost(e,d.opsSettings);
    });
  });
  return Object.keys(byHub).sort(function(a,b){ return a==='Unassigned'?1:(b==='Unassigned'?-1:a.localeCompare(b)); }).map(function(k){return byHub[k];});
}

const Views=(function(){

  function officeName(id){
    if(id==='ALL') return 'All Branches';
    const o=Store.getOffices().find(function(x){return x.id===id;}); return o?o.name:'';
  }

  function branchSummary(officeId){
    const d=Store.getData(officeId);
    const facDone = d.facility.filter(function(f){return f.status==='Completed';}).length;
    const facTotal = d.facility.length;
    const sanc = d.manpower.reduce(function(s,m){return s+Number(m.sanc||0);},0);
    const onroll = d.manpower.reduce(function(s,m){return s+Number(m.onroll||0);},0);
    const shortfall = d.assets.reduce(function(s,a){return s+(Number(a.req||0)-Number(a.avail||0));},0);
    const orgFilled = d.orgChart.filter(function(o){return o.name && o.name.trim();}).length;
    const orgTotal = d.orgChart.length;
    const totInward=d.opsEntries.reduce(function(s,e){return s+Number(e.inward||0);},0);
    const totDelivered=d.opsEntries.reduce(function(s,e){return s+Number(e.delivered||0);},0);
    const totCOD=d.opsEntries.reduce(function(s,e){return s+Number(e.codCash||0);},0);
    const totKms=d.opsEntries.reduce(function(s,e){return s+Number(e.kmsRun||0);},0);
    const totCost=d.opsEntries.reduce(function(s,e){return s+opsEntryCost(e,d.opsSettings);},0);
    const peopleOrgDone=d.peopleOrg.filter(function(p){return p.status==='Completed';}).length;
    return {
      officeId:officeId, facDone:facDone, facTotal:facTotal, facPct: facTotal? Math.round(facDone/facTotal*100):0,
      sanc:sanc, onroll:onroll, fillPct: sanc? Math.round(onroll/sanc*100):0,
      shortfall:shortfall, assetsTotal:d.assets.length,
      orgFilled:orgFilled, orgTotal:orgTotal,
      totInward:totInward, totDelivered:totDelivered, successPct: totInward? Math.round(totDelivered/totInward*100):0,
      totCOD:totCOD, totKms:totKms, totCost:totCost,
      peopleOrgDone:peopleOrgDone, peopleOrgTotal:d.peopleOrg.length,
      notStarted:d.facility.filter(function(f){return f.status==='Not Started';}).length,
      shortageAssets:d.assets.filter(function(a){return a.status==='Shortage';}).length,
      opsCount:d.opsEntries.length,
    };
  }

  function generateInsights(officeId){
    const s=branchSummary(officeId);
    const insights=[];
    if(s.facPct<30){
      insights.push({level:'bad', text:'Facility readiness is critically low at '+s.facPct+'% ('+s.facDone+'/'+s.facTotal+' items). Prioritize Civil & Layout and Safety & Security categories first \u2014 these gate everything else.'});
    } else if(s.facPct<80){
      insights.push({level:'warn', text:'Facility checklist is '+s.facPct+'% complete. '+(s.facTotal-s.facDone)+' items remain \u2014 on track but not yet audit-ready.'});
    } else {
      insights.push({level:'good', text:'Facility checklist is '+s.facPct+'% complete \u2014 close to audit-ready.'});
    }
    if(s.sanc>0){
      if(s.fillPct<50){
        insights.push({level:'bad', text:'Manpower fill rate is only '+s.fillPct+'% ('+s.onroll+'/'+s.sanc+'). '+(s.sanc-s.onroll)+' positions vacant against sanctioned strength \u2014 hiring should be the top operational priority this month.'});
      } else if(s.fillPct<90){
        insights.push({level:'warn', text:'Manpower fill rate is '+s.fillPct+'%, with '+(s.sanc-s.onroll)+' positions still vacant.'});
      } else {
        insights.push({level:'good', text:'Manpower is fully or near-fully staffed at '+s.fillPct+'% fill rate.'});
      }
    }
    if(s.shortfall>0){
      insights.push({level:'bad', text:'Asset shortfall of '+s.shortfall+' units detected across '+s.assetsTotal+' tracked items \u2014 procurement/audit needed before operations scale further.'});
    } else {
      insights.push({level:'good', text:'No asset shortfall currently recorded across '+s.assetsTotal+' tracked items.'});
    }
    if(s.opsCount===0){
      insights.push({level:'info', text:'No daily operations entries logged yet. Start logging Inward/Delivered/COD/KMs on the Operations Dashboard to unlock delivery-success and cost trend insights here.'});
    } else {
      if(s.successPct<80){
        insights.push({level:'bad', text:'Delivery success rate is '+s.successPct+'% ('+s.totDelivered+'/'+s.totInward+') across '+s.opsCount+' logged entries \u2014 below the 80% healthy threshold. Investigate top failure reasons and consider call-before-attempt discipline.'});
      } else {
        insights.push({level:'good', text:'Delivery success rate is '+s.successPct+'% across '+s.opsCount+' logged entries \u2014 above the 80% healthy threshold.'});
      }
    }
    if(s.orgTotal>0){
      if(s.orgFilled<s.orgTotal){
        insights.push({level:'info', text:'Org chart is '+Math.round(s.orgFilled/s.orgTotal*100)+'% complete \u2014 '+(s.orgTotal-s.orgFilled)+' of '+s.orgTotal+' positions still show as Unassigned.'});
      } else {
        insights.push({level:'good', text:'Org chart is fully populated \u2014 every sanctioned position has a name assigned.'});
      }
    }
    return insights;
  }

  function insightPill(level){
    if(level==='bad') return {cls:'bad', icon:'\u26A0'};
    if(level==='warn') return {cls:'warn', icon:'\u26A0'};
    if(level==='good') return {cls:'good', icon:'\u2713'};
    return {cls:'', icon:'\u2139'};
  }

  function misAndInsightsInner(officeId){
    const s=branchSummary(officeId);
    const insights=generateInsights(officeId);
    const mis='<div class="tblWrap"><table><thead><tr><th>MIS Area</th><th>Metric</th><th>Value</th></tr></thead><tbody>'
      + [
          ['Operations', 'Total Inward', s.totInward],
          ['Operations', 'Total Delivered', s.totDelivered],
          ['Operations', 'Delivery Success %', s.successPct+'%'],
          ['Operations', 'COD Collected', Util.inr(s.totCOD)],
          ['Operations', 'Total KMs Run', s.totKms],
          ['Operations', 'Total Operating Cost', Util.inr(s.totCost)],
          ['Manpower', 'Sanctioned Strength', s.sanc],
          ['Manpower', 'On-Roll (Actual)', s.onroll],
          ['Manpower', 'Vacancy', s.sanc-s.onroll],
          ['Manpower', 'Fill Rate %', s.fillPct+'%'],
          ['Facility', 'Checklist Completed', s.facDone+' / '+s.facTotal],
          ['Facility', 'Completion %', s.facPct+'%'],
          ['Assets', 'Total Shortfall (units)', s.shortfall],
          ['Assets', 'Marked Shortage', s.shortageAssets],
          ['Org Chart', 'Positions Filled', s.orgFilled+' / '+s.orgTotal],
          ['Handover (People & Org)', 'Items Completed', s.peopleOrgDone+' / '+s.peopleOrgTotal],
        ].map(function(r){ return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td class="mono">'+r[2]+'</td></tr>'; }).join('')
      + '</tbody></table></div>';
    const insightCards='<div class="insightGrid">'
      + insights.map(function(ins){
          const p=insightPill(ins.level);
          return '<div class="insightCard'+(p.cls?' '+p.cls:'')+'" style="border-left-color:'
            +(ins.level==='bad'?'var(--red)':ins.level==='warn'?'var(--amber)':ins.level==='good'?'var(--green)':'var(--navy)')+';">'
            + '<span class="icon">'+p.icon+'</span><p>'+ins.text+'</p></div>';

  function branchFilterBar(officeId, role){

  function kpiIconCard(cls, icon, label, val, sub){

  function hubYnInput(hub, f){
    const v=hubFieldValue(hub,f);
    const opts=['', 'Y', 'N'];
    return '<select onchange="Actions.updateHubField(\''+hub.id+'\',\''+f.key+'\',this.value)">'
      + opts.map(function(o){ return '<option value="'+o+'" '+(v===o?'selected':'')+'>'+(o===''?'\u2014':o)+'</option>'; }).join('')
      + '</select>';
  }
  function hubFieldInput(hub, f){
    const v=hubFieldValue(hub,f);
    if(f.type==='yn') return hubYnInput(hub, f);
    if(f.type==='date') return '<input type="date" value="'+v+'" onchange="Actions.updateHubField(\''+hub.id+'\',\''+f.key+'\',this.value)">';
    if(f.type==='number') return '<input type="number" value="'+v+'" onchange="Actions.updateHubField(\''+hub.id+'\',\''+f.key+'\',this.value===\'\'?\'\':Number(this.value))">';
    return '<input type="text" value="'+(v||'').toString().replace(/"/g,'&quot;')+'" onchange="Actions.updateHubField(\''+hub.id+'\',\''+f.key+'\',this.value)">';
  }
  function hubFieldDisplay(h, f){
    const v=hubFieldValue(h,f);
    if(v==='') return '<span style="color:var(--grey);">\u2014</span>';
    if(f.type==='yn') return '<span class="pill '+(v==='Y'?'Yes':'No')+'">'+(v==='Y'?'Yes':'No')+'</span>';
    if(f.currency) return Util.inr(v);
    return v+(f.suffix||'');
  }

  function hubSummaryView(){
    const hubs=Store.getHubs();
    const visited=hubs.filter(function(h){return h.visitPlan==='Visited';}).length;
    const pending=hubs.length-visited;
    const totalPossible=hubs.length*HUB_FIELDS.length;
    let totalFilled=0;
    hubs.forEach(function(h){ totalFilled += hubCompletion(h).filled; });
    const overallPct = totalPossible? Math.round(totalFilled/totalPossible*1000)/10 : 0;

    const fieldRows = HUB_FIELDS.map(function(f){
      const filled = hubs.filter(function(h){ return hubFieldFilled(h,f); }).length;
      const blank = hubs.length-filled;
      const pct = hubs.length? Math.round(filled/hubs.length*100) : 0;
      return '<tr><td>'+f.label+'</td><td class="mono">'+filled+'</td><td class="mono">'+blank+'</td><td class="mono">'+hubs.length+'</td>'
        + '<td style="min-width:120px;">'+pct+'%<div class="miniBar '+hubBarClass(pct)+'"><i style="width:'+pct+'%;"></i></div></td></tr>';
    }).join('');

    const amRows = Array.from(new Set(hubs.map(function(h){return h.am;}))).filter(Boolean).sort().map(function(am){
      const list=hubs.filter(function(h){return h.am===am;});
      const v=list.filter(function(h){return h.visitPlan==='Visited';}).length;
      return '<tr><td>'+am+'</td><td class="mono">'+list.length+'</td><td class="mono">'+v+'</td><td class="mono">'+(list.length-v)+'</td>'
        + '<td class="mono">'+Math.round(v/list.length*100)+'%</td></tr>';
    }).join('');

    return '<div class="statStrip">'
      + '<div class="cell"><div class="n">'+hubs.length+'</div><div class="l">Total Hubs</div></div>'
      + '<div class="cell"><div class="n" style="color:var(--green);">'+visited+'</div><div class="l">Hubs Visited</div></div>'
      + '<div class="cell"><div class="n" style="color:var(--red);">'+pending+'</div><div class="l">Hubs Pending</div></div>'
      + '<div class="cell"><div class="n">'+overallPct+'%</div><div class="l">Overall Checklist Completion</div></div>'
      + '</div>'
      + '<div class="sectionHead"><span class="dot"></span><h3>By Area Manager</h3></div>'
      + '<div class="tblWrap"><table><thead><tr><th>Area Manager</th><th>Total Hubs</th><th>Visited</th><th>Pending</th><th>Visit %</th></tr></thead><tbody>'+amRows+'</tbody></table></div>'
      + '<div class="sectionHead"><span class="dot"></span><h3>Field-wise Completion (across all '+hubs.length+' hubs, '+HUB_FIELDS.length+' checklist fields)</h3></div>'
      + '<div class="tblWrap tall"><table><thead><tr><th>Field / Heading</th><th>Filled</th><th>Blank</th><th>Total Hubs</th><th>Completion %</th></tr></thead><tbody>'+fieldRows+'</tbody></table></div>';
  }

  function pincodeFinder(role){

    const splitLog=Store.getSplitLog();

    const geoCount=hubs.filter(hubHasGeo).length;
    const allPincodes=new Set();
    hubs.forEach(function(h){ pincodeTokens(h.pincode).forEach(function(p){ allPincodes.add(p); }); });

    const statStrip='<div class="statStrip">'
      + '<div class="cell"><div class="n">'+hubs.length+'</div><div class="l">Total Hubs</div></div>'
      + '<div class="cell"><div class="n" style="color:'+(geoCount<hubs.length?'var(--amber)':'var(--green)')+';">'+geoCount+'/'+hubs.length+'</div><div class="l">Hubs with Lat/Long Set</div></div>'
      + '<div class="cell"><div class="n">'+allPincodes.size+'</div><div class="l">Pincodes Tracked</div></div>'
      + '<div class="cell"><div class="n">'+splitLog.length+'</div><div class="l">Splits Logged</div></div>'
      + '</div>';

    let resultsHtml='';
    if(query.pincode){
      const currentHub=findHubServingPincode(query.pincode);
      resultsHtml += '<div style="margin:10px 0;">'
        + (currentHub ? '<span class="pill Yes">Currently served by: '+currentHub.name+'</span>' : '<span class="pill No">Not yet assigned to any hub</span>')
        + '</div>';
      const lat=Number(query.lat), lng=Number(query.lng);
      if(query.lat!==''&&query.lng!==''&&!isNaN(lat)&&!isNaN(lng)){
        const nearest=pincodeNearestHubs(lat, lng, 5);
        if(nearest.length){
          resultsHtml += '<div class="tblWrap"><table><thead><tr><th>#</th><th>Hub</th><th>Type</th><th>AM</th><th>Distance</th><th></th></tr></thead><tbody>'
            + nearest.map(function(r,i){
                const isCurrent = currentHub && currentHub.id===r.hub.id;
                return '<tr'+(isCurrent?' style="background:var(--teal-l);"':'')+'><td class="mono">'+(i+1)+'</td>'
                  + '<td><b>'+r.hub.name+'</b>'+(isCurrent?' <span class="pill Yes" style="margin-left:4px;">Current</span>':'')+'</td>'
                  + '<td>'+r.hub.type+'</td><td>'+(r.hub.am||'')+'</td><td class="mono">'+r.distKm.toFixed(1)+' km</td>'
                  + '<td>'+(isCurrent? '' : '<button class="btn small primary" onclick="Actions.assignPincodeToHub(\''+r.hub.id+'\')">Assign Here</button>')+'</td></tr>';
              }).join('')
            + '</tbody></table></div>';
        } else {
          resultsHtml += '<div class="placeholderBox">No hubs have latitude/longitude set yet \u2014 add coordinates in the Hub Location Directory below to enable nearest-hub suggestions.</div>';
        }
      } else {
        resultsHtml += '<div class="placeholderBox">Add latitude &amp; longitude above for this pincode to see nearest-hub distance suggestions (optional \u2014 without it you\u2019ll only see which hub currently serves this pincode, if any).</div>';
      }

    const finderPanel='<div class="panel"><h3>Find Nearest Hub for a Pincode</h3>'
      + '<div class="inlineForm">'
      + '<div><label>Pincode</label><input type="text" id="pfPincode" placeholder="e.g. 641004" value="'+(query.pincode||'')+'"></div>'
      + '<div><label>Latitude <span style="font-weight:400;color:var(--grey);">(optional)</span></label><input type="number" step="0.0001" id="pfLat" placeholder="e.g. 10.9958" value="'+(query.lat||'')+'"></div>'
      + '<div><label>Longitude <span style="font-weight:400;color:var(--grey);">(optional)</span></label><input type="number" step="0.0001" id="pfLng" placeholder="e.g. 76.9629" value="'+(query.lng||'')+'"></div>'
      + '<div><label>Note / Reason <span style="font-weight:400;color:var(--grey);">(optional)</span></label><input type="text" id="pfNote" placeholder="e.g. Volume spike 500+/day" value="'+(query.note||'')+'"></div>'
      + '<div><button class="btn primary" onclick="Actions.runPincodeFinder()">Find Nearest Hub</button></div>'
      + (query.pincode? '<div><button class="btn small" onclick="Actions.clearPincodeFinder()">Clear</button></div>' : '')
      + '</div>'
      + resultsHtml
      + '</div>';

    const dirRows=hubs.map(function(h){
      const hasGeo=hubHasGeo(h);
      return '<tr><td><b>'+h.name+'</b></td><td>'+h.type+'</td><td>'+(h.am||'')+'</td>'
        + '<td><input type="text" value="'+(h.pincode||'').toString().replace(/"/g,'&quot;')+'" style="min-width:180px;" placeholder="e.g. 641004, 641014" onchange="Actions.updateHubField(\''+h.id+'\',\'pincode\',this.value)"></td>'
        + '<td><input type="number" step="0.0001" value="'+(h.lat===''?'':h.lat)+'" style="width:100px;" placeholder="optional" onchange="Actions.updateHubField(\''+h.id+'\',\'lat\',this.value===\'\'?\'\':Number(this.value))"></td>'
        + '<td><input type="number" step="0.0001" value="'+(h.lng===''?'':h.lng)+'" style="width:100px;" placeholder="optional" onchange="Actions.updateHubField(\''+h.id+'\',\'lng\',this.value===\'\'?\'\':Number(this.value))"></td>'
        + '<td><span class="pill '+(hasGeo?'Yes':'No')+'">'+(hasGeo?'Geo Set':'Missing')+'</span></td></tr>';
    }).join('');
    const dirTable='<div class="sectionHead"><span class="dot"></span><h3>Hub Location Directory \u2014 Pincodes &amp; Coordinates (all '+hubs.length+' hubs)</h3></div>'
      + '<div class="tblWrap tall"><table><thead><tr><th>Hub Name</th><th>Type</th><th>AM</th><th>Pincode(s) Served</th><th>Latitude</th><th>Longitude</th><th>Status</th></tr></thead><tbody>'
      + dirRows + '</tbody></table></div>';

    const logRows=splitLog.map(function(l){
      return '<tr><td class="mono">'+l.date+'</td><td class="mono">'+l.pincode+'</td><td>'+l.fromHub+'</td><td>'+l.toHub+'</td><td>'+(l.note||'')+'</td>'
        + (role==='super'? '<td><button class="btn small danger" onclick="Actions.deleteSplitLogEntry(\''+l.id+'\')">Del</button></td>' : '')
        + '</tr>';
    }).join('');
    const logTable='<div class="sectionHead"><span class="dot"></span><h3>Pincode Split / Reassignment Log</h3></div>'
      + '<div class="tblWrap"><table><thead><tr><th>Date</th><th>Pincode</th><th>From Hub</th><th>To Hub</th><th>Note</th>'+(role==='super'?'<th></th>':'')+'</tr></thead><tbody>'
      + (logRows || '<tr><td colspan="'+(role==='super'?6:5)+'" style="text-align:center;color:var(--grey);padding:16px;">No splits logged yet \u2014 use \u201CAssign Here\u201D above to move a pincode to a nearer hub.</td></tr>')
      + '</tbody></table></div>';

    return '<h1 class="pageTitle">Pincode Split Finder</h1>'
      + '<p class="pageSub">Track which pincodes each hub serves, and find the nearest hub when a pincode\u2019s volume grows enough to need splitting or reassigning.</p>'
      + statStrip + finderPanel + dirTable + logTable;
  }

  function dailyConvClass(pct){ return pct>=85?'good':(pct>=70?'warn':'bad'); }

  const DAILY_BASE_COLS = [{key:'name', label:'Hub Name'}, {key:'type', label:'Type'}, {key:'am', label:'AM'}];
  const DAILY_ALL_COLS = DAILY_BASE_COLS.concat(DAILY_FIELDS);

  function dailyTrendSvg(days, hubFilter){
    const w=600, h=150, padX=14, padY=16;
    const dayRows = function(d){ return hubFilter ? d.rows.filter(function(r){return r.name===hubFilter;}) : d.rows; };
    const totals = days.map(function(d){ return dayRows(d).reduce(function(s,r){ return s+(Number(r.totalLoad)||0); },0); });
    const convs = days.map(function(d){
      const rs=dayRows(d);
      const loadSum=rs.reduce(function(s,r){return s+(Number(r.totalLoad)||0);},0);
      const delSum=rs.reduce(function(s,r){return s+(Number(r.overallDelivered)||0);},0);
      return loadSum? Math.min(100, Math.max(0, delSum/loadSum*100)) : null;
    });
    const maxTotal=Math.max.apply(null, totals)||1, minTotal=Math.min.apply(null, totals.concat([0]));
    const convVals=convs.filter(function(v){return v!==null;});
    const maxConv=convVals.length? Math.max.apply(null, convVals):100, minConv=convVals.length? Math.min.apply(null, convVals):0;
    const n=days.length, stepX = n>1 ? (w-2*padX)/(n-1) : 0;
    function sy(v,min,max){ return max===min ? h/2 : (h-padY-(v-min)/(max-min)*(h-2*padY)); }
    const totalPts = totals.map(function(v,i){ return (padX+i*stepX)+','+sy(v,minTotal,maxTotal); }).join(' ');
    const convPts = convs.map(function(v,i){ return v===null? null : (padX+i*stepX)+','+sy(v,minConv,maxConv); }).filter(function(x){return x;}).join(' ');
    const totalDots = totals.map(function(v,i){ return '<circle cx="'+(padX+i*stepX)+'" cy="'+sy(v,minTotal,maxTotal)+'" r="3" fill="#1F3864"><title>'+days[i].label+': '+v+' total load</title></circle>'; }).join('');
    const convDots = convs.map(function(v,i){ return v===null? '' : '<circle cx="'+(padX+i*stepX)+'" cy="'+sy(v,minConv,maxConv)+'" r="3" fill="#0F7C6B"><title>'+days[i].label+': '+v.toFixed(1)+'% conversion</title></circle>'; }).join('');
    const labels = days.map(function(d,i){ return '<text x="'+(padX+i*stepX)+'" y="'+(h-2)+'" font-size="8.5" fill="#717784" text-anchor="middle">'+d.label+'</text>'; }).join('');
    return '<svg class="trendSvg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'
      + '<polyline points="'+totalPts+'" fill="none" stroke="#1F3864" stroke-width="2"/>'
      + (convPts? '<polyline points="'+convPts+'" fill="none" stroke="#0F7C6B" stroke-width="2" stroke-dasharray="4,3"/>' : '')
      + totalDots + convDots + labels + '</svg>';
  }

  function dailyReview(role){
    const days=Store.getDailyReview();
    let selId=UIState.getDailyReviewDayId();
    if(!selId || !days.find(function(d){return d.id===selId;})) selId = days.length? days[days.length-1].id : null;
    UIState.setDailyReviewDayId(selId);
    if(!selId){
      return '<h1 class="pageTitle">Daily Review \u2014 Day Start</h1>'
        + '<div class="placeholderBox">No day tabs yet.'+(role==='super'? ' <button class="btn primary small" style="margin-left:8px;" onclick="Actions.addDailyReviewDay()">+ Add Day</button>' : '')+'</div>';
    }
    const day=days.find(function(d){return d.id===selId;});
    const allRows=day.rows;
    const hubList=Store.getHubs().map(function(h){return h.name;}); // canonical 31 fixed hub names
    const hubFilter=UIState.getDailyHubFilter();
    const colFilters=UIState.getDailyColFilters();

    const rows = allRows.filter(function(r){
      if(hubFilter && r.name!==hubFilter) return false;
      for(const key in colFilters){
        const col=DAILY_ALL_COLS.find(function(c){return c.key===key;});
        if(!col) continue;
        const v=dailyFieldValue(r,col);
        const vs=(v===undefined||v===null)?'':String(v);
        if(vs!==colFilters[key]) return false;
      }
      return true;
    });

    const tabStrip = '<div class="dateTabStrip">'
      + days.map(function(d){ return '<div class="dateTab '+(d.id===selId?'active':'')+'" onclick="Actions.selectDailyReviewDay(\''+d.id+'\')">'+d.label+'<span class="d">'+d.date+'</span></div>'; }).join('')
      + (role==='super' ? '<div class="dateTabAdd" onclick="Actions.addDailyReviewDay()">+ Add Day</div>' : '')
      + '</div>';

    const activeFilterCount=Object.keys(colFilters).length;
    const filterBar = '<div class="panel dailyFilterBar" style="padding:10px 14px;">'
      + '<b>Hub:</b><select onchange="Actions.setDailyHubFilter(this.value)">'
        + '<option value="">All 31 Hubs</option>'
        + hubList.map(function(h){ return '<option value="'+h+'" '+(hubFilter===h?'selected':'')+'>'+h+'</option>'; }).join('')
        + '</select>'
      + '<b>Date:</b><select onchange="Actions.selectDailyReviewDay(this.value)">'
        + days.map(function(d){ return '<option value="'+d.id+'" '+(d.id===selId?'selected':'')+'>'+d.label+' \u2014 '+d.date+'</option>'; }).join('')
        + '</select>'
      + (activeFilterCount || hubFilter ? '<button class="btn small" onclick="Actions.clearDailyFilters()">\u2715 Clear Filters'+(activeFilterCount?' ('+activeFilterCount+')':'')+'</button>' : '')
      + '<span style="margin-left:auto;font-size:11px;color:var(--grey);">Showing '+rows.length+' / '+allRows.length+' hubs</span>'
      + '</div>';

    const sum=function(key){ return rows.reduce(function(s,r){ return s+(Number(r[key])||0); },0); };
    const totalLoad=sum('totalLoad'), freshLoad=sum('freshLoad'), totalVolumetric=sum('totalVolumetric');
    const riaSum=sum('ria'), adhocSum=sum('adhoc'), rtoSum=sum('rtoRvp');
    const overallDeliveredSum=sum('overallDelivered'), freshDeliveredSum=sum('freshDelivered');
    // Overall Conversion % = Overall Delivered / Total Load. Fresh Conversion % = Fresh Delivered / Fresh Load. Clamped to 0-100%.
    const overallConv = totalLoad? Math.min(100, Math.max(0, overallDeliveredSum/totalLoad*100)) : 0;
    const freshConv = freshLoad? Math.min(100, Math.max(0, freshDeliveredSum/freshLoad*100)) : 0;
    const overallConvCls = dailyConvClass(overallConv);
    const freshConvCls = dailyConvClass(freshConv);
    const preAlertYes = rows.filter(function(r){return r.preAlertMail==='Yes';}).length;

    const kpis = '<div class="cardGrid compact">'
      + '<div class="kpi grad"><div class="lbl">Total Load</div><div class="val">'+totalLoad.toLocaleString('en-IN')+'</div></div>'
      + '<div class="kpi teal"><div class="lbl">Fresh Load</div><div class="val">'+freshLoad.toLocaleString('en-IN')+'</div></div>'
      + '<div class="kpi '+overallConvCls+'"><div class="lbl">Overall Conversion</div><div class="val">'+overallConv.toFixed(1)+'%</div></div>'
      + '<div class="kpi '+freshConvCls+'"><div class="lbl">Fresh Conversion</div><div class="val">'+freshConv.toFixed(1)+'%</div></div>'
      + '<div class="kpi indigo"><div class="lbl">Total Volumetric</div><div class="val">'+totalVolumetric.toLocaleString('en-IN')+'</div></div>'
      + '<div class="kpi"><div class="lbl">Pre-Alert Sent</div><div class="val">'+preAlertYes+'/'+rows.length+'</div></div>'
      + '<div class="kpi '+(riaSum>0?'warn':'good')+'"><div class="lbl">RIA</div><div class="val">'+riaSum+'</div></div>'
      + '<div class="kpi '+(adhocSum>0?'warn':'good')+'"><div class="lbl">Adhoc</div><div class="val">'+adhocSum+'</div></div>'
      + '<div class="kpi '+(rtoSum>0?'bad':'good')+'"><div class="lbl">RTO / RVP</div><div class="val">'+rtoSum+'</div></div>'
      + '</div>';

    const addHubRow = role==='super'
      ? '<div class="inlineForm" style="margin-bottom:10px;">'
        + '<div><label>Hub Name</label><input type="text" id="newDailyHubName_'+day.id+'" placeholder="e.g. NewHub_XYZ"></div>'
        + '<div><label>Type</label><input type="text" id="newDailyHubType_'+day.id+'" placeholder="DH / LDP / MDH" value="DH"></div>'
        + '<div><label>Area Manager</label><input type="text" id="newDailyHubAm_'+day.id+'" placeholder="AM name"></div>'
        + '<div><button class="btn primary" onclick="Actions.addDailyRow(\''+day.id+'\')">Add Hub Row</button></div>'
        + '</div>'
      : '';

  function operations(officeId, role){

      + '</select>'
      + (opsHubFilter? '<button class="btn small" onclick="Actions.setOpsHubFilter(\'\')">\u2715 Clear</button>' : '')
      + '</div>';

    if(officeId==='ALL'){
      const rows=aggregateOpsAcrossOffices(opsHubFilter);
      const totInward=rows.reduce(function(s,r){return s+r.totInward;},0);
      const totDelivered=rows.reduce(function(s,r){return s+r.totDelivered;},0);
      const successPct = totInward? Math.round(totDelivered/totInward*100):0;
      const totCOD=rows.reduce(function(s,r){return s+r.totCOD;},0);
      const totKms=rows.reduce(function(s,r){return s+r.totKms;},0);
      const totCost=rows.reduce(function(s,r){return s+r.totCost;},0);
      const hubRows = aggregateOpsByHub();
      return '<h1 class="pageTitle">Operations Dashboard \u2014 All Branches</h1>'
        + '<p class="pageSub">Aggregate daily-operations performance across every branch'+(opsHubFilter? ' \u2014 filtered to '+opsHubFilter : '')+'</p>'

        + '<div class="kpi"><div class="lbl">COD Collected</div><div class="val">'+Util.inr(totCOD)+'</div></div>'
        + '<div class="kpi"><div class="lbl">Total KMs Run</div><div class="val">'+totKms+'</div></div>'
        + '<div class="kpi"><div class="lbl">Total Cost</div><div class="val">'+Util.inr(totCost)+'</div></div>'
        + '</div>'
        + '<div class="sectionHead"><span class="dot"></span><h3>By Branch'+(opsHubFilter?' (filtered to '+opsHubFilter+')':'')+'</h3></div>'
        + '<div class="tblWrap"><table><thead><tr><th>Branch</th><th>Inward</th><th>Delivered</th><th>COD Collected</th><th>KMs Run</th><th>Cost</th></tr></thead><tbody>'
        + rows.map(function(r){ return '<tr><td>'+r.name+'</td><td class="mono">'+r.totInward+'</td><td class="mono">'+r.totDelivered+'</td><td class="mono">'+Util.inr(r.totCOD)+'</td><td class="mono">'+r.totKms+'</td><td class="mono">'+Util.inr(r.totCost)+'</td></tr>'; }).join('')
        + '</tbody></table></div>'
        + '<div class="sectionHead"><span class="dot"></span><h3>By Hub (across all branches)</h3></div>'

        + '</tbody></table></div>';
    }

    const dFull=Store.getData(officeId);
    const s=dFull.opsSettings;
    const allEntries=dFull.opsEntries;
    const filteredEntries = opsHubFilter ? allEntries.filter(function(e){return e.hub===opsHubFilter;}) : allEntries;
    const d=Object.assign({}, dFull, {opsEntries: filteredEntries});

    const totInward=d.opsEntries.reduce(function(sum,e){return sum+Number(e.inward||0);},0);
    const totDelivered=d.opsEntries.reduce(function(sum,e){return sum+Number(e.delivered||0);},0);
    const successPct=totInward? Math.round(totDelivered/totInward*100):0;

    const totCost=d.opsEntries.reduce(function(sum,e){return sum+opsEntryCost(e,s);},0);

    const metricInputs = metrics.map(function(m){
      return '<div><label>'+m.name+' ('+(m.unit||'count')+')</label><input type="number" id="opMetric_'+m.id+'" value="0" step="0.01"></div>';
    }).join('');
    const entryForm = '<div class="panel"><h3>Add End-of-Day Entry</h3><div class="inlineForm">'

      + '</div></div>';

    const metricThs = metrics.map(function(m){ return '<th>'+m.name+'</th>'; }).join('');
    const entryRows = d.opsEntries.slice().reverse().map(function(e){
      const emp=dFull.employees.find(function(x){return x.id===e.employeeId;});
      const undel=Number(e.inward||0)-Number(e.delivered||0);
      const succ=e.inward? Math.round(Number(e.delivered||0)/Number(e.inward||1)*100):0;
      const cost=opsEntryCost(e,s);
      const empOpts2 = dFull.employees.map(function(x){ return '<option value="'+x.id+'" '+(x.id===e.employeeId?'selected':'')+'>'+x.code+'</option>'; }).join('');
      const hubOpts2 = '<option value="">\u2014</option>' + hubList.map(function(h){ return '<option value="'+h+'" '+(e.hub===h?'selected':'')+'>'+h+'</option>'; }).join('');
      const metricTds=metrics.map(function(m){
        return '<td><input type="number" value="'+((e.custom&&e.custom[m.id])||0)+'" style="min-width:56px;" onchange="Actions.updateOpsEntryCustom(\''+officeId+'\',\''+e.id+'\',\''+m.id+'\',Number(this.value))"></td>';
      }).join('');
      return '<tr><td><input type="date" value="'+e.date+'" onchange="Actions.updateOpsEntryField(\''+officeId+'\',\''+e.id+'\',\'date\',this.value)"></td>'

        + '<td><select onchange="Actions.updateOpsEntryField(\''+officeId+'\',\''+e.id+'\',\'hub\',this.value)">'+hubOpts2+'</select></td>'

        + '<td><input type="number" value="'+e.delivered+'" onchange="Actions.updateOpsEntryField(\''+officeId+'\',\''+e.id+'\',\'delivered\',Number(this.value))"></td>'

  function exportAgentTrackCsv(){
    const data=Store.getAgentTrack();
    const cols=['Area Manager'].concat(AGENTTRACK_COLS.map(function(c){return c.label;})).concat(['Conv%','CPD Conv%']);
    const esc=function(v){ v=(v===undefined||v===null)?'':String(v); return '"'+v.replace(/"/g,'""')+'"'; };
    const lines=[cols.map(esc).join(',')];
    data.rows.forEach(function(r){
      const conv=r.totalOfd? (r.delivered/r.totalOfd*100).toFixed(1):'0.0';
      const cpdConv=r.cpdAssigned? (r.cpdDel/r.cpdAssigned*100).toFixed(1):'0.0';
      const row=[r.am].concat(AGENTTRACK_COLS.map(function(c){return r[c.key];})).concat([conv+'%', cpdConv+'%']);
      lines.push(row.map(esc).join(','));
    });
    const blob=new Blob([lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='live_agent_tracking_'+data.asOf+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);

  function applyAgentTrackPaste(){
    const raw=document.getElementById('agentTrackPaste').value.trim();
    if(!raw){ alert('Paste some rows first.'); return; }
    const lines=raw.split('\n').map(function(l){return l.trim();}).filter(function(l){return l;});
    const cols=['am'].concat(AGENTTRACK_COLS.map(function(c){return c.key;}));
    const newRows=[];
    for(let i=0;i<lines.length;i++){
      const parts=lines[i].split('\t');
      if(parts.length<2){ parts.length=0; lines[i].split(',').forEach(function(p){parts.push(p);}); }
      if(parts.length<2) continue;
      const rec={id:Util.uid()};
      cols.forEach(function(key,idx){
        let v=parts[idx]!==undefined? parts[idx].trim() : '';
        if(key!=='am') v = v===''? 0 : Number(v.replace(/[^0-9.\-]/g,'')) || 0;
        rec[key]=v;
      });
      if(rec.am) newRows.push(rec);
    }
    if(!newRows.length){ alert('Could not parse any rows \u2014 make sure they\u2019re tab-separated (paste straight from Excel/Sheets) with Area Manager name first.'); return; }
    const data=Store.getAgentTrack();
    data.rows=newRows;
    Store.setAgentTrack(data);
    showToast('Snapshot rows updated \u2713');
    document.getElementById('agentTrackPaste').value='';
    UIState.setAgentTrackAmFilter('');
    refresh();
  }

  function assignPincodeToHub(hubId){
    const query=UIState.getPincodeFinderQuery();
    const target=String(query.pincode||'').trim();
    if(!target) return;
    const hubs=Store.getHubs();
    let fromHub=null;
    hubs.forEach(function(h){
      const list=pincodeTokens(h.pincode);
      const idx=list.indexOf(target);
      if(idx!==-1 && h.id!==hubId){
        list.splice(idx,1);
        h.pincode=list.join(', ');
        fromHub=h.name;
      }
    });
    const toHub=hubs.find(function(h){return h.id===hubId;});

      if(list.indexOf(target)===-1){ list.push(target); toHub.pincode=list.join(', '); }
    }
    Store.setHubs(hubs);
    const log=Store.getSplitLog();
    log.unshift({id:Util.uid(), date:Util.todayISO(), pincode:target, fromHub:fromHub||'(unassigned)', toHub:toHub?toHub.name:'', note:query.note||''});
